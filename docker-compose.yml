services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lis
      POSTGRES_PASSWORD: lis
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lis"]
      interval: 2s
      timeout: 3s
      retries: 30
