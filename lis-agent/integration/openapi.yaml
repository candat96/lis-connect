openapi: 3.0.3
info:
  title: LIS Agent – API tích hợp HIS/CIS
  version: "1.0"
  description: |
    API của LIS Agent (cài tại phòng xét nghiệm) để HIS/CIS **gửi chỉ định** và **nhận kết quả** máy xét nghiệm.

    **Luồng chuẩn**
    1. Lấy mẫu, dán mã vạch (SID) lên ống → HIS gọi `POST /orders` với SID và danh sách xét nghiệm (mã HIS).
    2. Máy quét SID, hỏi Agent → Agent trả danh sách xét nghiệm (đổi sang mã máy theo bảng ánh xạ cấu hình ở Agent).
    3. Máy chạy xong gửi kết quả → Agent đổi mã máy sang mã HIS và trả về HIS bằng một trong hai cách:
       - **Webhook** (khuyên dùng): Agent `POST` bản tin `ResultPayload` tới địa chỉ HIS khai báo ở Agent.
         HIS trả HTTP 2xx là xong; lỗi/timeout Agent gửi lại (30 giây, 1, 2, 4… tối đa 30 phút).
         Có khóa ký thì header `X-Signature: sha256=<hex HMAC-SHA256(khóa, nguyên văn body)>`.
       - **HIS tự kéo**: `GET /results?since=…` định kỳ, xử lý xong `POST /results/ack`.
    4. Kết quả là số liệu máy gửi, **chưa duyệt**: HIS để ở trạng thái chờ duyệt, bác sĩ xét nghiệm duyệt mới trả.

    Một kết quả có thể đến nhiều lần cho cùng SID (máy chạy lại, chạy bổ sung): HIS ghi đè theo `testCode`,
    chống trùng theo `resultId`.

    **Xác thực**: mọi lời gọi (trừ `/health`) kèm header `X-Api-Key` — khóa tạo ở tab "Kết nối HIS/CIS" của Agent.
servers:
  - url: http://{agentHost}:8090/api/v1
    variables:
      agentHost:
        default: 192.168.1.20
        description: IP máy cài LIS Agent trong mạng nội bộ
security:
  - apiKey: []
paths:
  /health:
    get:
      summary: Kiểm tra Agent còn chạy
      security: []
      responses:
        "200":
          description: Đang chạy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: "2026.11.02" }
                  time: { type: string, format: date-time }
  /orders:
    post:
      summary: Gửi hoặc cập nhật chỉ định theo SID
      description: |
        Gửi lại cùng SID = cập nhật (thêm/bớt xét nghiệm, sửa thông tin người bệnh). Chỉ định đã hủy gửi lại được
        khôi phục. Mã xét nghiệm là mã của HIS; Agent tự đổi sang mã máy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
            example:
              sid: "2611020001"
              hisOrderId: "CD261102-0015"
              patient: { code: "BN000123", name: "NGUYEN VAN A", dob: "1985-04-12", gender: male }
              tests: [{ code: GLU, name: Glucose }, { code: URE, name: Ure }]
              doctor: "BS. Tran Van B"
              room: "Phòng khám 01"
      responses:
        "200":
          description: Đã nhận
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /orders/{sid}:
    get:
      summary: Xem chỉ định và trạng thái
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      responses:
        "200":
          description: Chỉ định
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{sid}/cancel:
    post:
      summary: Hủy chỉ định (máy hỏi SID này sẽ không nhận được xét nghiệm)
      parameters: [{ $ref: "#/components/parameters/Sid" }]
      responses:
        "200":
          description: Đã hủy
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: huy } }
        "404": { $ref: "#/components/responses/NotFound" }
  /results:
    get:
      summary: Kéo kết quả (khi HIS không mở được địa chỉ nhận webhook)
      parameters:
        - name: since
          in: query
          description: Chỉ lấy kết quả nhận sau thời điểm này (RFC 3339)
          schema: { type: string, format: date-time, example: "2026-11-02T08:00:00+07:00" }
        - name: sid
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Kết quả mới nhất trước, tối đa 500
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResultPayload" }
  /results/ack:
    post:
      summary: Báo HIS đã nhận các kết quả (Agent ngừng gửi lại, chỉ định chuyển "đã trả HIS")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string }, description: "Danh sách resultId" }
      responses:
        "200":
          description: Đã ghi nhận
          content:
            application/json:
              schema:
                type: object
                properties: { acked: { type: integer } }
webhooks:
  result:
    post:
      summary: Agent gửi kết quả về HIS (địa chỉ cấu hình ở Agent)
      parameters:
        - name: X-Signature
          in: header
          description: "sha256=<hex HMAC-SHA256(khóa ký, nguyên văn body)> — có khi cấu hình khóa ký"
          schema: { type: string }
        - name: X-Lis-Agent
          in: header
          schema: { type: string, example: "1" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultPayload" }
      responses:
        "200": { description: HIS đã nhận — Agent không gửi lại }
        "500": { description: Lỗi bất kỳ (không phải 2xx) — Agent gửi lại sau }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    Sid:
      name: sid
      in: path
      required: true
      schema: { type: string }
  responses:
    Invalid:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: invalid, message: "Chưa có xét nghiệm nào" }
    Unauthorized:
      description: Sai hoặc thiếu khóa API
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Không có chỉ định
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    Patient:
      type: object
      required: [name]
      properties:
        code: { type: string, description: Mã người bệnh bên HIS }
        name: { type: string, description: Họ tên (nên viết hoa) }
        dob: { type: string, format: date, description: yyyy-MM-dd }
        gender: { type: string, enum: [male, female] }
    Test:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Mã xét nghiệm của HIS }
        name: { type: string }
    OrderInput:
      type: object
      required: [sid, patient, tests]
      properties:
        sid: { type: string, maxLength: 40, description: "Mã vạch ống mẫu (không chứa | \\ ^ &)" }
        hisOrderId: { type: string, description: Mã phiếu chỉ định bên HIS — trả lại trong kết quả }
        patient: { $ref: "#/components/schemas/Patient" }
        tests:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Test" }
        doctor: { type: string }
        room: { type: string }
        note: { type: string }
    Order:
      allOf:
        - $ref: "#/components/schemas/OrderInput"
        - type: object
          properties:
            source: { type: string, enum: [his, manual] }
            status:
              type: string
              enum: [cho, dang-chay, co-ket-qua, da-gui, huy]
              description: "cho = chờ máy, dang-chay = máy đã hỏi, co-ket-qua, da-gui = đã trả HIS, huy"
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ResultItem:
      type: object
      properties:
        testCode: { type: string, description: "Mã HIS (sau ánh xạ); trống = máy gửi mã chưa ánh xạ" }
        deviceCode: { type: string, description: Mã chỉ số trên máy }
        testName: { type: string }
        value: { type: string, description: "Giá trị nguyên văn máy gửi (số hoặc chữ)" }
        unit: { type: string }
        flag: { type: string, description: "Cờ máy gửi: H, L, HH, LL, N, A…" }
        refRange: { type: string, description: Khoảng tham chiếu máy gửi }
    ResultPayload:
      type: object
      properties:
        resultId: { type: string, description: Dùng chống trùng và để ack }
        sid: { type: string }
        hisOrderId: { type: string }
        patientCode: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        receivedAt: { type: string, format: date-time }
        results:
          type: array
          items: { $ref: "#/components/schemas/ResultItem" }
