name: lis-connect

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

  core:
    image: lis-connect-core:${CORE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_started
    environment:
      CORE_PORT: 3000
      NODE_ENV: production
      # Core nói với PgBouncer, không nói thẳng với Postgres.
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/lis_admin
      TENANT_DATABASE_URL_TEMPLATE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/{db}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Bí mật ký JWT đăng nhập Web UI — bắt buộc, không có giá trị mặc định.
      # Sinh bằng `openssl rand -base64 48`, xem deploy/README.md.
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      replicas: 2

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - core
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
