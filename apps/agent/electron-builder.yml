appId: vn.lisconnect.agent
productName: LIS Connect Agent
directories:
  output: dist
  buildResources: build
# `better-sqlite3` và `serialport` bị Vite externalize (xem
# electron.vite.config.ts) nên không nằm trong `out/`; chúng phải được đóng gói
# nguyên trạng từ `node_modules` (bản nhị phân biên dịch cho ABI Electron —
# chạy `pnpm --filter @lis/agent rebuild better-sqlite3` sau bước build và
# TRƯỚC khi package, xem cảnh báo ở đầu tài liệu triển khai). Nếu `files` chỉ
# liệt kê `out/**/*` và `package.json` như bản nháp ban đầu, electron-builder
# sẽ KHÔNG đóng `node_modules` vào bộ cài và Agent chết ngay khi khởi động vì
# thiếu native module — nên phải khai rõ `node_modules/**/*` ở đây.
files:
  - out/**/*
  - node_modules/**/*
  - package.json
win:
  target:
    - nsis
  artifactName: LIS-Connect-Agent-${version}-setup.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  include: build/installer.nsh
extraResources:
  - from: build/install-autostart.ps1
    to: install-autostart.ps1
