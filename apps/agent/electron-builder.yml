appId: vn.lisconnect.agent
productName: LIS Connect Agent
directories:
  output: dist
  buildResources: build
# `better-sqlite3` và `serialport` bị Vite externalize (xem
# electron.vite.config.ts) nên không nằm trong `out/`; chúng phải được đóng gói
# nguyên trạng từ `node_modules` (bản nhị phân biên dịch cho ABI Electron —
# chạy `pnpm --filter @lis/agent rebuild better-sqlite3` sau bước build và
# TRƯỚC khi package, xem cảnh báo ở đầu tài liệu triển khai).
#
# KHÔNG thêm `node_modules/**/*` vào đây: electron-builder mặc định đã tự
# phân giải cây phụ thuộc production từ `dependencies` trong package.json của
# gói này (better-sqlite3, serialport, ws, @lis/shared đều khai đúng ở đó) và
# loại devDependencies (electron, electron-builder, vite, react... một mình
# electron đã ~243MB). Ghi đè `files` bằng một glob quét cả node_modules sẽ
# nhồi toàn bộ devDependencies vào bộ cài — ĐÃ THỬ và gỡ bỏ vì lý do này, xem
# report Task 17 (vòng sửa 1) để biết cách kiểm chứng khi có máy Windows.
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
  artifactName: LIS-Connect-Agent-${version}-setup.exe
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  include: build/installer.nsh
# icon.png và tray.png cũng phải có mặt trong bản cài dưới dạng resource thô:
# main/index.ts đọc chúng lúc chạy (BrowserWindow icon, Tray) qua
# `process.resourcesPath`, khác với `win.icon` ở trên — cái đó chỉ được
# electron-builder dùng lúc BUILD để sinh ra icon .exe/.ico, không có mặt lúc
# runtime.
extraResources:
  - from: build/install-autostart.ps1
    to: install-autostart.ps1
  - from: build/icon.png
    to: icon.png
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png
